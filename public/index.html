<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVO Deal Desk</title>
<style>
  /* Tokens are roles, not swatches. Each has a light and a dark value; the OS setting picks. */
  :root {
    color-scheme: light dark;
    --canvas: light-dark(#f5f5f1, #0b0c0e);
    --surface: light-dark(#ecece7, #131519);   /* columns, drawer */
    --raised: light-dark(#ffffff, #1b1e23);    /* cards, inputs */
    --line: light-dark(#d9d9d2, #2a2e35);
    --text: light-dark(#14161a, #f2f3f5);
    --dim: light-dark(#565c66, #9aa1ad);
    --action: #d4ff3a;                         /* primary buttons only */
    --on-action: #0b0c0e;
    --accent-text: light-dark(#3d5200, #d4ff3a);
    --warn: light-dark(#8a5300, #ffb547);
    --error: light-dark(#b3261e, #ff8080);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    /* spacing scale, 4px base: 4 8 12 16 24 32 */
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--line) transparent; }
  body { margin: 0; background: var(--canvas); color: var(--text); font: 0.9375rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; accent-color: var(--accent-text); }
  ::selection { background: var(--action); color: var(--on-action); }
  button, input, select { font: inherit; color: inherit; }
  h1, h2, h3 { text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  .btn { background: var(--action); color: var(--on-action); border: 1px solid transparent; border-radius: 8px; padding: 8px 16px; min-height: 40px; font-weight: 650; cursor: pointer; transition: filter 120ms; }
  .btn:hover { filter: brightness(0.93); }
  .btn:active { filter: brightness(0.86); }
  .btn:disabled { opacity: 0.55; cursor: progress; filter: none; }
  .btn.quiet { background: transparent; color: var(--text); border-color: var(--line); font-weight: 500; }
  .btn.quiet:hover { background: var(--raised); filter: none; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; padding: 16px 24px; }
  .logo { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .logo span { font-weight: 500; color: var(--dim); margin-left: 8px; letter-spacing: 0; font-size: 0.9375rem; }
  /* Summary is one line of figures, not a row of metric cards: the board is the page. */
  .summary { display: flex; flex-wrap: wrap; gap: 4px 24px; margin: 0; flex: 1; }
  .summary div { display: flex; align-items: baseline; gap: 8px; }
  .summary dt { color: var(--dim); }
  .summary dd { margin: 0; font-weight: 700; font-size: 1.125rem; }

  #status { margin: 0 24px 12px; padding: 8px 12px; border: 1px solid var(--error); border-radius: 8px; color: var(--error); background: var(--raised); }
  #status:empty { display: none; }

  .board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; padding: 0 24px 24px; overflow-x: auto; }
  .col { background: var(--surface); border-radius: 12px; padding: 12px; min-height: 60vh; outline: 2px solid transparent; transition: outline-color 120ms; }
  .col.over { outline-color: var(--accent-text); }
  .col h2 { display: flex; justify-content: space-between; margin: 0 4px 12px; font-size: 0.875rem; font-weight: 650; }
  .col h2 span { color: var(--dim); font-weight: 500; }
  .col .empty { color: var(--dim); margin: 24px 4px; font-size: 0.875rem; }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: grab; transition: border-color 120ms; }
  .card:hover { border-color: var(--dim); }
  .card:active { cursor: grabbing; }
  .card .brand { font-weight: 700; }
  .card .title { color: var(--dim); margin-bottom: 8px; }
  .card .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 8px; }
  .card .value { font-weight: 650; }
  .tag { font-size: 0.8125rem; color: var(--dim); }
  .tag.stale { color: var(--warn); }
  .tag.call { color: var(--accent-text); font-weight: 600; }

  /* The deal drawer is a native modal dialog: focus stays inside it and the board behind is inert. */
  #drawer { position: fixed; inset: 0 0 0 auto; margin: 0; width: min(480px, 100vw); max-width: none; height: 100dvh; max-height: none; border-radius: 0; padding: 24px; overflow-y: auto; box-shadow: -24px 0 48px -12px rgb(0 0 0 / 0.35); }
  #drawer[open] { animation: slide-in 300ms var(--ease-out); }
  #drawer::backdrop { background: rgb(0 0 0 / 0.25); }
  @keyframes slide-in { from { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { #drawer[open] { animation: none; } }
  #drawer h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
  #drawer h3 { margin: 32px 0 8px; font-size: 0.875rem; font-weight: 650; }
  .meta { color: var(--dim); margin: 4px 0 16px; }
  .meta b { color: var(--text); }
  .meta a { color: inherit; text-underline-offset: 3px; }
  .field { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; width: 100%; }
  .field:hover { border-color: var(--dim); }
  .inline { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .ai { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .score { font-size: 2rem; font-weight: 800; color: var(--accent-text); letter-spacing: -0.03em; line-height: 1.1; }
  .score span { font-size: 0.9375rem; color: var(--dim); font-weight: 500; letter-spacing: 0; margin-left: 8px; }
  .ai p { margin: 8px 0; max-width: 65ch; text-wrap: pretty; }
  .ai pre { white-space: pre-wrap; font: inherit; background: var(--canvas); border-radius: 8px; padding: 12px; margin: 12px 0; }
  .timeline { list-style: none; margin: 16px 0 0; padding: 0; }
  .timeline li { padding: 12px 0; border-top: 1px solid var(--line); }
  .timeline .when { display: flex; gap: 8px; color: var(--dim); font-size: 0.8125rem; }
  .timeline .kind { color: var(--text); font-weight: 600; }
  .err { color: var(--error); margin: 8px 0 0; }
  .err:empty { display: none; }

  dialog { background: var(--surface); color: var(--text); border: 0; border-radius: 12px; padding: 24px; width: min(440px, 92vw); box-shadow: 0 24px 48px -12px rgb(0 0 0 / 0.4); }
  dialog::backdrop { background: rgb(0 0 0 / 0.5); }
  #dlg h1 { margin: 0 0 16px; font-size: 1.25rem; }
  #dlg label { display: block; margin-bottom: 12px; font-weight: 500; }
  #dlg label .field { margin-top: 4px; font-weight: 400; }
  #dlg small { color: var(--dim); font-weight: 400; }
  /* Phones get a list grouped by stage, not a squeezed five-column board. */
  @media (max-width: 720px) {
    header { justify-content: space-between; }
    .summary { order: 3; flex-basis: 100%; }
    .board { grid-template-columns: 1fr; overflow: visible; }
    .col { min-height: 0; }
    .col .empty { margin: 4px; }
  }
  footer { color: var(--dim); padding: 0 24px 24px; font-size: 0.875rem; }
</style>
</head>
<body>
<header>
  <div class="logo">OVO <span>Deal Desk</span></div>
  <dl class="summary num" id="summary" aria-label="Pipeline summary"></dl>
  <button class="btn" id="new">New deal</button>
</header>
<p id="status" role="alert"></p>
<main class="board" id="board"></main>
<footer>Sample data. Drag a deal to another stage, or open it and change the stage there.</footer>

<dialog id="drawer" aria-labelledby="drawerTitle"></dialog>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="form">
    <h1 id="dlgTitle">New deal</h1>
    <label>Brand <input class="field" name="brand" required maxlength="200"></label>
    <label>Deal <small>e.g. Spring campaign, 3 videos</small><input class="field" name="title" required maxlength="200"></label>
    <label>Value <small>whole US dollars</small><input class="field num" name="value" type="number" min="0" step="1" required inputmode="numeric"></label>
    <label>Contact name <input class="field" name="contact_name" required maxlength="200"></label>
    <label>Contact email <input class="field" name="contact_email" type="email" required></label>
    <p class="err" id="formErr" role="alert"></p>
    <div class="inline" style="justify-content:flex-end;margin-top:16px">
      <button class="btn quiet" type="button" onclick="dlg.close()">Cancel</button>
      <button class="btn">Create deal</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const compact = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: 1 });
const when = (iso) => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const quietDays = (d) => Math.floor((Date.now() - new Date(d.updated_at)) / 864e5);
const KIND = { note: 'Note', stage: 'Stage', call: 'Call booked' };

async function api(path, method = 'GET', body) {
  let r;
  try { r = await fetch('/api' + path, { method, body: body && JSON.stringify(body) }); }
  catch { throw new Error("Can't reach the server. Check that it is running, then try again."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error ?? 'Something went wrong on the server. Try again.');
  return j;
}
// Every failed action surfaces here instead of failing silently.
addEventListener('unhandledrejection', (e) => {
  $('status').textContent = e.reason?.message ?? String(e.reason);
  setTimeout(() => ($('status').textContent = ''), 6000);
});

let stages = [], deals = [], openId = null;
const prob = (d) => stages.find((s) => s.id === d.stage).prob;

async function load() {
  ({ stages, deals } = await api('/deals'));
  const open = deals.filter((d) => prob(d) < 1);
  const sum = (list, f = (d) => d.value) => list.reduce((n, d) => n + f(d), 0);
  $('summary').innerHTML = [
    ['Open pipeline', compact.format(sum(open))],
    ['Weighted forecast', compact.format(sum(open, (d) => d.value * prob(d)))],
    ['Total won', compact.format(sum(deals.filter((d) => prob(d) === 1)))],
    ['Calls booked', deals.filter((d) => d.next_call).length],
  ].map(([label, n]) => `<div><dt>${label}</dt><dd>${n}</dd></div>`).join('');

  $('board').innerHTML = stages.map((s) => {
    const list = deals.filter((d) => d.stage === s.id);
    return `<section class="col" data-stage="${s.id}" aria-label="${s.label}">
      <h2>${s.label} <span class="num">${list.length ? `${list.length} · ${compact.format(sum(list))}` : ''}</span></h2>
      ${list.map(card).join('') || `<p class="empty">No deals in ${s.label.toLowerCase()} yet.</p>`}
    </section>`;
  }).join('');
}

function card(d) {
  const q = quietDays(d);
  const tag = d.next_call ? `<span class="tag call">Call ${esc(when(d.next_call))}</span>`
    : q >= 7 && prob(d) < 1 ? `<span class="tag stale">Quiet for ${q} days</span>` : '';
  return `<div class="card" draggable="true" tabindex="0" role="button" data-id="${d.id}" aria-label="Open ${esc(d.brand)}: ${esc(d.title)}">
    <div class="brand">${esc(d.brand)}</div>
    <div class="title">${esc(d.title)}</div>
    <div class="row"><span class="value num">${usd.format(d.value)}</span>${tag}</div>
  </div>`;
}

// Board interactions: one delegated listener each instead of per-card handlers.
const board = $('board');
board.addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) openDeal(+c.dataset.id); });
board.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card')) { e.preventDefault(); openDeal(+e.target.dataset.id); } });
board.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', e.target.closest('.card').dataset.id));
board.addEventListener('dragover', (e) => { const col = e.target.closest('.col'); if (col) { e.preventDefault(); col.classList.add('over'); } });
board.addEventListener('dragleave', (e) => e.target.closest('.col')?.classList.remove('over'));
board.addEventListener('drop', (e) => {
  e.preventDefault();
  const col = e.target.closest('.col');
  if (col) move(+e.dataTransfer.getData('text/plain'), col.dataset.stage);
});

async function move(id, stage) {
  await api(`/deals/${id}`, 'PATCH', { stage });
  await load();
  if (openId === id) openDeal(id, true);
}

const drawer = $('drawer');
const closeDeal = () => drawer.close();
// Fires for the Close button, Escape, and a click on the backdrop alike.
drawer.addEventListener('close', () => {
  const id = openId;
  openId = null;
  document.querySelector(`.card[data-id="${id}"]`)?.focus(); // the board re-renders, so refocus by id
});
drawer.addEventListener('click', (e) => { if (e.target === drawer && e.clientX < drawer.getBoundingClientRect().left) closeDeal(); });

async function openDeal(id, keepAi) {
  const d = drawer;
  const wasOpen = openId === id && d.open;
  openId = id;
  const { deal, activities, bookings } = await api(`/deals/${id}`);
  const link = `${location.origin}/book/${id}`;
  const ai = keepAi && wasOpen ? $('ai').innerHTML
    : `<p style="margin-top:0">Reads this deal's activity and drafts the email that moves it forward.</p><button class="btn" id="run">Draft next move</button>`;
  d.innerHTML = `
    <div class="inline"><h1 class="grow" id="drawerTitle">${esc(deal.brand)}</h1><button class="btn quiet" id="close">Close</button></div>
    <p class="meta">${esc(deal.title)} · <b class="num">${usd.format(deal.value)}</b><br>
      ${esc(deal.contact_name)} · <a href="mailto:${esc(deal.contact_email)}">${esc(deal.contact_email)}</a></p>
    <label class="inline">Stage
      <select class="field" id="stage">${stages.map((s) => `<option value="${s.id}" ${s.id === deal.stage ? 'selected' : ''}>${s.label}</option>`).join('')}</select>
    </label>

    <h3>Copilot</h3>
    <div class="ai" id="ai" aria-live="polite">${ai}</div>

    <h3><label for="link">Booking link</label></h3>
    <div class="inline"><input class="field" id="link" readonly value="${link}"><button class="btn quiet" id="copyLink" style="white-space:nowrap">Copy link</button></div>
    <p class="meta" style="margin-top:8px">${bookings.length
      ? bookings.map((b) => `Call on ${esc(when(b.slot))} with ${esc(b.name)}`).join('<br>')
      : `No calls booked yet. Send ${esc(deal.contact_name.split(' ')[0])} this link to pick a time.`}</p>

    <h3><label for="noteBody">Activity</label></h3>
    <form class="inline" id="note"><input class="field" id="noteBody" name="body" required maxlength="2000" autocomplete="off"><button class="btn quiet" style="white-space:nowrap">Add note</button></form>
    <ul class="timeline">${activities.map((a) =>
      `<li><div class="when"><span class="kind">${KIND[a.kind] ?? esc(a.kind)}</span><time>${esc(when(a.created_at))}</time></div>${esc(a.body)}</li>`).join('')}</ul>`;
  if (!d.open) d.showModal();

  $('close').onclick = closeDeal;
  $('stage').onchange = (e) => move(id, e.target.value);
  $('copyLink').onclick = (e) => copy(link, e.target);
  $('note').onsubmit = async (e) => {
    e.preventDefault();
    await api(`/deals/${id}/notes`, 'POST', { body: e.target.body.value });
    await load();
    await openDeal(id, true);
    $('noteBody').focus();
  };
  wireAi(link);
}

async function runCopilot(id, link) {
  $('ai').innerHTML = `<button class="btn" disabled>Reading the activity log…</button>`;
  try {
    const r = await api(`/deals/${id}/copilot`, 'POST');
    const body = r.email_body.replaceAll('{booking_link}', link);
    $('ai').innerHTML = `
      <div class="score num">${r.source === 'claude' ? '' : '~'}${esc(r.score)}%<span>chance to close</span></div>
      <p class="meta" style="margin:4px 0 12px;font-size:0.8125rem">${r.source === 'claude' ? "Claude's estimate from the activity log." : 'Rough estimate from stage, days since last touch, and booked calls.'}</p>
      <p>${esc(r.reasoning)}</p>
      <p><b>Next:</b> ${esc(r.next_action)}</p>
      <pre id="draft"><b>${esc(r.email_subject)}</b>\n\n${esc(body)}</pre>
      <div class="inline"><button class="btn" id="copyDraft">Copy email</button><button class="btn quiet" id="rerun">Draft again</button></div>`;
  } catch (e) {
    $('ai').innerHTML = `<p class="err" style="margin-top:0">Couldn't draft a next move. ${esc(e.message)}</p><button class="btn" id="rerun" style="margin-top:12px">Try again</button>`;
  }
  wireAi(link);
}
function wireAi(link) {
  if ($('copyDraft')) $('copyDraft').onclick = (e) => copy($('draft').innerText, e.target);
  for (const b of [$('rerun'), $('run')]) if (b) b.onclick = () => runCopilot(openId, link);
}
async function copy(text, btn) {
  await navigator.clipboard.writeText(text);
  const was = btn.textContent;
  btn.textContent = 'Copied';
  setTimeout(() => (btn.textContent = was), 1200);
}

$('new').onclick = () => { $('formErr').textContent = ''; $('dlg').showModal(); };
$('form').onsubmit = async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  try {
    const deal = await api('/deals', 'POST', { ...f, value: Number(f.value) });
    e.target.reset();
    $('dlg').close();
    await load();
    openDeal(deal.id);
  } catch (err) { $('formErr').textContent = err.message; }
};

load();
</script>
</body>
</html>
